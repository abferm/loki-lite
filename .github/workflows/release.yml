name: Release

# Run only after the CI workflow has completed, so releases are gated on
# CI passing for the exact commit being published. The tag that triggered
# the run is detected from the commit (head_sha) rather than github.ref,
# which points at the default branch for workflow_run events.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  publish:
    name: Publish image to Docker Hub
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: "Docker Hub"
    permissions:
      contents: read
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Find release tag at CI commit
        id: find-tag
        run: |
          tag="$(git describe --exact-match --tags HEAD 2>/dev/null | grep '^v' || true)"
          if [ -z "$tag" ]; then
            echo "Commit ${{ github.event.workflow_run.head_sha }} is not tagged with a v* release tag"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.find-tag.outputs.release == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.find-tag.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image tags from git tag
        if: steps.find-tag.outputs.release == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: abferm/loki-lite
          tags: |
            type=semver,pattern={{version}},value=${{ steps.find-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.find-tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.find-tag.outputs.tag }}
            type=raw,value=latest

      - name: Build and push production image
        if: steps.find-tag.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le,linux/riscv64,linux/s390x
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
